<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="description" content="A fixed, self-contained SourceLoop study pack.">
  <title>Campus Routes Lab · SourceLoop offline pack</title>
  <style>
    :root {
      --paper: #f3eee3;
      --paper-deep: #e7dece;
      --card: #fffaf0;
      --ink: #17231f;
      --muted: #5d6962;
      --teal: #0a6b60;
      --teal-dark: #064b45;
      --teal-wash: #d9ece5;
      --amber: #bb6c15;
      --amber-wash: #f8e6c7;
      --red: #a33a32;
      --red-wash: #f7dfda;
      --line: #c9c0b0;
      --shadow: 0 18px 50px rgba(39, 48, 43, .10);
      --radius: 18px;
      --serif: Georgia, "Times New Roman", "Noto Serif SC", serif;
      --sans: "Segoe UI", "Noto Sans SC", system-ui, sans-serif;
      --mono: "Cascadia Mono", "SFMono-Regular", Consolas, monospace;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(circle at 8% 8%, rgba(10, 107, 96, .10), transparent 26rem),
        linear-gradient(90deg, rgba(23, 35, 31, .035) 1px, transparent 1px),
        var(--paper);
      background-size: auto, 28px 28px, auto;
      font-family: var(--sans);
      line-height: 1.6;
    }
    button, input { font: inherit; }
    button { color: inherit; }
    a { color: var(--teal); }
    .skip-link {
      position: fixed;
      left: 1rem;
      top: -6rem;
      z-index: 100;
      padding: .7rem 1rem;
      color: white;
      background: var(--teal-dark);
      border-radius: 8px;
    }
    .skip-link:focus { top: 1rem; }
    .topbar {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 1rem clamp(1rem, 4vw, 3.5rem);
      border-bottom: 1px solid var(--line);
      background: rgba(243, 238, 227, .93);
    }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: .7rem;
      min-width: 0;
      font-weight: 800;
      letter-spacing: -.03em;
    }
    .brand-mark {
      display: grid;
      width: 2.1rem;
      height: 2.1rem;
      place-items: center;
      color: var(--card);
      background: var(--teal);
      border-radius: 50%;
      font-family: var(--serif);
      font-size: 1.25rem;
    }
    .top-context {
      min-width: 0;
      margin-left: auto;
      color: var(--muted);
      font-size: .86rem;
    }
    .lang-switch {
      min-width: 5.6rem;
      padding: .55rem .8rem;
      color: var(--teal-dark);
      background: transparent;
      border: 1px solid var(--teal);
      border-radius: 999px;
      cursor: pointer;
      font-weight: 750;
    }
    .lang-switch:hover { background: var(--teal-wash); }
    button:focus-visible, summary:focus-visible, input:focus-visible,
    label:has(input:focus-visible) {
      outline: 3px solid var(--amber);
      outline-offset: 3px;
    }
    .page {
      width: min(1240px, calc(100% - 2rem));
      margin: 0 auto;
      padding: clamp(1.2rem, 3vw, 2.8rem) 0 4rem;
    }
    .intro {
      max-width: 820px;
      margin-bottom: 1.7rem;
    }
    .eyebrow {
      margin: 0 0 .5rem;
      color: var(--teal);
      font-family: var(--mono);
      font-size: .78rem;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    h1, h2, h3, p { margin-top: 0; }
    h1 {
      margin-bottom: .65rem;
      font-family: var(--serif);
      font-size: clamp(2.2rem, 6vw, 4.6rem);
      font-weight: 500;
      letter-spacing: -.045em;
      line-height: .98;
    }
    .intro p:last-child {
      max-width: 66ch;
      margin-bottom: 0;
      color: var(--muted);
      font-size: clamp(1rem, 2vw, 1.17rem);
    }
    .layout {
      display: grid;
      grid-template-columns: 260px minmax(0, 1fr);
      gap: clamp(1.2rem, 3vw, 2.5rem);
      align-items: start;
    }
    .lesson-nav {
      position: sticky;
      top: 1rem;
      padding: .7rem;
      background: rgba(255, 250, 240, .72);
      border: 1px solid var(--line);
      border-radius: var(--radius);
    }
    .nav-label {
      padding: .65rem .7rem .4rem;
      color: var(--muted);
      font-family: var(--mono);
      font-size: .72rem;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    .lesson-button {
      display: grid;
      grid-template-columns: 2rem minmax(0, 1fr);
      gap: .65rem;
      width: 100%;
      padding: .75rem;
      text-align: left;
      background: transparent;
      border: 0;
      border-radius: 12px;
      cursor: pointer;
    }
    .lesson-button:hover { background: var(--teal-wash); }
    .lesson-button[aria-current="page"] {
      color: var(--teal-dark);
      background: var(--teal-wash);
    }
    .lesson-number {
      color: var(--amber);
      font-family: var(--mono);
      font-size: .78rem;
      font-weight: 800;
    }
    .lesson-button strong { display: block; font-size: .9rem; line-height: 1.3; }
    .lesson-button small { color: var(--muted); }
    .lesson-card {
      overflow: hidden;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: calc(var(--radius) + 4px);
      box-shadow: var(--shadow);
    }
    .lesson-head {
      padding: clamp(1.3rem, 4vw, 2.8rem);
      border-bottom: 1px solid var(--line);
    }
    .lesson-meta {
      display: flex;
      flex-wrap: wrap;
      gap: .55rem 1rem;
      margin-bottom: 1rem;
      color: var(--muted);
      font-family: var(--mono);
      font-size: .76rem;
      text-transform: uppercase;
      letter-spacing: .05em;
    }
    .lesson-head h2 {
      max-width: 18ch;
      margin-bottom: .7rem;
      font-family: var(--serif);
      font-size: clamp(2rem, 5vw, 3.8rem);
      font-weight: 500;
      letter-spacing: -.035em;
      line-height: 1.03;
    }
    .lesson-summary {
      max-width: 62ch;
      margin-bottom: 0;
      color: var(--muted);
      font-size: 1.08rem;
    }
    .reading {
      padding: clamp(1.3rem, 4vw, 2.8rem);
      border-bottom: 1px solid var(--line);
    }
    .reading-block { position: relative; max-width: 68ch; }
    .reading-block + .reading-block { margin-top: 1.5rem; }
    .reading-block.lead p {
      margin-bottom: .8rem;
      font-family: var(--serif);
      font-size: clamp(1.35rem, 3vw, 1.75rem);
      line-height: 1.3;
    }
    .reading-block p { margin-bottom: .8rem; }
    .callout {
      padding: 1.2rem 1.35rem;
      background: var(--amber-wash);
      border-left: 4px solid var(--amber);
      border-radius: 0 12px 12px 0;
    }
    .callout h3 { margin-bottom: .4rem; font-size: 1rem; }
    .callout p { margin-bottom: .7rem; }
    .source-chip {
      display: inline-flex;
      align-items: center;
      gap: .35rem;
      padding: .3rem .55rem;
      color: var(--teal-dark);
      background: var(--teal-wash);
      border: 0;
      border-radius: 999px;
      cursor: pointer;
      font-family: var(--mono);
      font-size: .72rem;
      font-weight: 700;
    }
    .source-chip:hover { text-decoration: underline; }
    .visual-section, .sources-section, .practice-section {
      padding: clamp(1.3rem, 4vw, 2.8rem);
      border-bottom: 1px solid var(--line);
    }
    .section-heading {
      display: flex;
      flex-wrap: wrap;
      align-items: end;
      justify-content: space-between;
      gap: .8rem;
      margin-bottom: 1.1rem;
    }
    .section-heading h3 {
      margin-bottom: .2rem;
      font-family: var(--serif);
      font-size: clamp(1.5rem, 3vw, 2.25rem);
      font-weight: 500;
      letter-spacing: -.025em;
    }
    .section-heading p { margin: 0; color: var(--muted); font-size: .9rem; }
    .visual-box {
      overflow: hidden;
      background: #fdf8ed;
      border: 1px solid var(--line);
      border-radius: 15px;
    }
    .graph-wrap { padding: .7rem; }
    #graph { display: block; width: 100%; height: auto; min-height: 220px; }
    .graph-edge { stroke: #9b968b; stroke-width: 3; }
    .graph-edge.final { stroke: var(--amber); stroke-width: 6; }
    .edge-label-bg { fill: var(--card); stroke: var(--line); stroke-width: 1; }
    .edge-label { fill: var(--ink); font: 700 13px var(--mono); }
    .node circle { fill: var(--card); stroke: #7d847e; stroke-width: 3; transition: 180ms ease; }
    .node.settled circle { fill: var(--teal-wash); stroke: var(--teal); }
    .node.current circle { fill: var(--amber); stroke: var(--amber); stroke-width: 5; }
    .node text { fill: var(--ink); font: 700 12px var(--sans); text-anchor: middle; pointer-events: none; }
    .node.current text { fill: #fffaf0; }
    .visual-controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: .55rem;
      padding: .85rem;
      border-top: 1px solid var(--line);
    }
    .control {
      padding: .55rem .85rem;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 9px;
      cursor: pointer;
      font-weight: 700;
    }
    .control.primary { color: white; background: var(--teal); border-color: var(--teal); }
    .control:disabled { cursor: not-allowed; opacity: .4; }
    .step-count { margin-left: auto; color: var(--muted); font: .78rem var(--mono); }
    .visual-output {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      border-top: 1px solid var(--line);
    }
    .distances { padding: 1rem; border-right: 1px solid var(--line); }
    .relaxations { padding: 1rem; }
    .micro-label {
      margin-bottom: .55rem;
      color: var(--muted);
      font: 700 .7rem var(--mono);
      letter-spacing: .06em;
      text-transform: uppercase;
    }
    .distance-grid { display: flex; flex-wrap: wrap; gap: .35rem; }
    .distance-pill {
      padding: .3rem .5rem;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 7px;
      font: .75rem var(--mono);
    }
    .distance-pill.settled { background: var(--teal-wash); border-color: var(--teal); }
    .distance-pill.current { color: white; background: var(--teal); border-color: var(--teal); }
    .relaxation-line { margin: .25rem 0; font: .78rem var(--mono); }
    .muted { color: var(--muted); }
    .sources-grid { display: grid; gap: .65rem; }
    .source-card { background: #fdf8ed; border: 1px solid var(--line); border-radius: 12px; }
    .source-card summary {
      display: flex;
      align-items: center;
      gap: .7rem;
      padding: .9rem 1rem;
      cursor: pointer;
      list-style: none;
    }
    .source-card summary::-webkit-details-marker { display: none; }
    .source-card summary::after {
      content: "+";
      margin-left: auto;
      color: var(--teal);
      font: 700 1.3rem var(--mono);
    }
    .source-card[open] summary::after { content: "−"; }
    .source-code {
      flex: 0 0 auto;
      padding: .2rem .4rem;
      color: var(--teal-dark);
      background: var(--teal-wash);
      border-radius: 5px;
      font: 800 .72rem var(--mono);
    }
    .source-summary strong { display: block; font-size: .9rem; }
    .source-summary small { color: var(--muted); }
    .source-quote {
      margin: 0 1rem 1rem;
      padding: 1rem;
      color: #38433e;
      background: var(--card);
      border-left: 3px solid var(--teal);
      font-family: var(--serif);
      line-height: 1.7;
    }
    .practice-intro {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: .8rem;
      margin-bottom: 1rem;
    }
    .practice-intro p { max-width: 55ch; margin: 0; color: var(--muted); }
    .question-list { display: grid; gap: 1.4rem; }
    .question {
      padding: 1.1rem;
      background: #fdf8ed;
      border: 1px solid var(--line);
      border-radius: 14px;
    }
    .question fieldset { min-width: 0; padding: 0; margin: 0; border: 0; }
    .question legend {
      width: 100%;
      margin-bottom: .8rem;
      font-weight: 750;
      line-height: 1.45;
    }
    .question-number {
      display: inline-block;
      margin-right: .4rem;
      color: var(--amber);
      font-family: var(--mono);
      font-size: .78rem;
    }
    .option {
      display: flex;
      align-items: flex-start;
      gap: .65rem;
      padding: .7rem .8rem;
      border: 1px solid transparent;
      border-radius: 9px;
      cursor: pointer;
    }
    .option:hover { background: var(--teal-wash); }
    .option input { flex: 0 0 auto; margin-top: .3rem; accent-color: var(--teal); }
    .submit-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: .8rem;
      margin-top: 1.3rem;
    }
    .submit-button {
      padding: .75rem 1.15rem;
      color: white;
      background: var(--teal);
      border: 1px solid var(--teal);
      border-radius: 9px;
      cursor: pointer;
      font-weight: 750;
    }
    .submit-button:disabled { cursor: wait; opacity: .6; }
    .form-status { color: var(--red); font-size: .88rem; }
    .result-summary {
      margin-top: 1.2rem;
      padding: 1rem;
      background: var(--teal-wash);
      border: 1px solid var(--teal);
      border-radius: 12px;
    }
    .result-summary strong { font-family: var(--serif); font-size: 1.3rem; }
    .result-list { display: grid; gap: .8rem; margin-top: .8rem; }
    .result {
      padding: .85rem 1rem;
      background: var(--card);
      border-left: 4px solid var(--teal);
      border-radius: 0 9px 9px 0;
    }
    .result.incorrect { border-left-color: var(--red); }
    .result p { margin: .35rem 0; }
    .result .result-label { font-weight: 800; }
    .result.incorrect .result-label { color: var(--red); }
    .retry-button {
      margin-top: .7rem;
      padding: .5rem .75rem;
      background: transparent;
      border: 1px solid var(--teal);
      border-radius: 8px;
      cursor: pointer;
      font-weight: 700;
    }
    .empty-practice {
      padding: 1rem;
      color: var(--muted);
      background: var(--paper);
      border: 1px dashed var(--line);
      border-radius: 12px;
    }
    .lesson-footer {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 1rem;
      padding: 1.2rem clamp(1.3rem, 4vw, 2.8rem);
      color: var(--muted);
      font-size: .82rem;
    }
    .lesson-footer p { margin: 0; }
    .offline-seal {
      display: inline-flex;
      align-items: center;
      gap: .45rem;
      color: var(--teal-dark);
      font-family: var(--mono);
      font-size: .72rem;
      font-weight: 700;
      text-transform: uppercase;
    }
    .offline-seal::before {
      content: "";
      width: .55rem;
      height: .55rem;
      background: var(--teal);
      border-radius: 50%;
    }
    .export-note {
      max-width: 78ch;
      margin: 1rem auto 0;
      padding: 1rem 1.2rem;
      color: var(--muted);
      background: rgba(255, 250, 240, .65);
      border: 1px solid var(--line);
      border-radius: 12px;
      font-size: .84rem;
    }
    @media (max-width: 820px) {
      .top-context { display: none; }
      .layout { grid-template-columns: 1fr; }
      .lesson-nav {
        position: static;
        display: flex;
        gap: .35rem;
        overflow-x: auto;
        padding: .5rem;
      }
      .nav-label { display: none; }
      .lesson-button { flex: 0 0 185px; grid-template-columns: 1.5rem minmax(0, 1fr); }
      .visual-output { grid-template-columns: 1fr; }
      .distances { border-right: 0; border-bottom: 1px solid var(--line); }
    }
    @media (max-width: 520px) {
      .page { width: min(100% - 1rem, 1240px); padding-top: .8rem; }
      .topbar { padding: .75rem; }
      .brand { font-size: .9rem; }
      .lesson-card { border-radius: 14px; }
      .lesson-head, .reading, .visual-section, .sources-section, .practice-section {
        padding: 1.05rem;
      }
      .step-count { width: 100%; margin-left: 0; }
      .source-summary small { display: none; }
      .lesson-footer { padding: 1rem; }
    }
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      *, *::before, *::after { transition-duration: .01ms !important; animation-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#lesson-content">Skip to lesson</a>
  <header class="topbar">
    <div class="brand"><span class="brand-mark" aria-hidden="true">S</span><span>SourceLoop</span></div>
    <span class="top-context">A three-stop micro-course in weighted graphs and shortest paths.</span>
    <button class="lang-switch" id="lang-toggle" type="button">中文</button>
  </header>
  <main class="page">
    <div class="intro">
      <p class="eyebrow" id="offline-eyebrow">Offline study pack</p>
      <h1>Campus Routes Lab</h1>
      <p id="pack-subtitle">A three-stop micro-course in weighted graphs and shortest paths.</p>
    </div>
    <div class="layout">
      <nav class="lesson-nav" id="lesson-nav" aria-label="Lessons"></nav>
      <article class="lesson-card" id="lesson-content" tabindex="-1">
        <header class="lesson-head">
          <div class="lesson-meta" id="lesson-meta"></div>
          <h2 id="lesson-title"></h2>
          <p class="lesson-summary" id="lesson-summary"></p>
        </header>
        <section class="reading" id="reading" aria-label="Lesson reading"></section>
        <section class="visual-section" id="visual-section" hidden>
          <div class="section-heading">
            <div>
              <h3 id="visual-title"></h3>
              <p id="visual-subtitle"></p>
            </div>
          </div>
          <div class="visual-box">
            <div class="graph-wrap">
              <svg id="graph" viewBox="0 0 648 432" role="img" aria-labelledby="graph-title"></svg>
            </div>
            <div class="visual-controls">
              <button class="control" id="reset-step" type="button"></button>
              <button class="control" id="back-step" type="button"></button>
              <button class="control primary" id="next-step" type="button"></button>
              <span class="step-count" id="step-count"></span>
            </div>
            <div class="visual-output">
              <div class="distances">
                <div class="micro-label" id="distances-label"></div>
                <div class="distance-grid" id="distance-grid"></div>
              </div>
              <div class="relaxations">
                <div class="micro-label" id="relaxations-label"></div>
                <div id="relaxation-log" aria-live="polite"></div>
              </div>
            </div>
          </div>
        </section>
        <section class="sources-section">
          <div class="section-heading">
            <div>
              <h3 id="sources-title"></h3>
              <p id="sources-subtitle"></p>
            </div>
          </div>
          <div class="sources-grid" id="source-list"></div>
        </section>
        <section class="practice-section">
          <div class="section-heading">
            <div>
              <h3 id="practice-title"></h3>
              <p id="practice-subtitle"></p>
            </div>
          </div>
          <div id="practice"></div>
        </section>
        <footer class="lesson-footer">
          <p id="footer-copy"></p>
          <span class="offline-seal" id="offline-seal"></span>
        </footer>
      </article>
    </div>
    <p class="export-note" id="export-note"></p>
  </main>
  <script id="pack-data" type="application/json">{"schema_version":1,"id":"campus-routes","origin":"curated","title":{"en":"Campus Routes Lab","zh":"校园路线实验室"},"subtitle":{"en":"A three-stop micro-course in weighted graphs and shortest paths.","zh":"用三节微课读懂加权图与最短路径。"},"description":{"en":"Read the map, test Dijkstra's frontier, and learn the assumption that keeps the shortcut honest.","zh":"先读懂地图，再观察 Dijkstra 的边界，最后看清让这条捷径成立的假设。"},"discipline":{"en":"Computer science · Algorithms","zh":"计算机科学 · 算法"},"authors":"SourceLoop team","license":"MIT","sources":[{"code":"S1","label":{"en":"Open notes 03 · §1","zh":"开放讲义 03 · 第1节"},"title":{"en":"What an edge weight means","zh":"边的权重意味着什么"},"text":{"en":"A weighted graph is a set of places, called vertices, joined by links called edges. Each edge carries a number called a weight. On a campus map, that number may be walking time, distance, cost, or delay. The graph is only a model: the weight has meaning because the mapmaker defines its unit.","zh":"加权图由地点（顶点）和连接它们的路线（边）组成。每条边带有一个数字，称为权重。在校园地图中，这个数字可以是步行时间、距离、费用或延误。图只是一个模型：权重只有在制图者说明单位时才有意义。"}},{"code":"S2","label":{"en":"Open notes 03 · §2","zh":"开放讲义 03 · 第2节"},"title":{"en":"Comparing whole routes","zh":"比较完整路线"},"text":{"en":"Route length is not counted by the number of edges. A route with two links can cost more than a route with four. To compare routes, add the weights of every edge on the route. The cheapest route is the one with the smallest total weight, not the fewest stops.","zh":"路线长度不能按边的数量来计算。一条只有两条边的路线，可能比有四条边的路线成本更高。比较路线时，应把沿途每条边的权重相加。最便宜的路线是总权重最小的路线，而不是站点最少的路线。"}},{"code":"S3","label":{"en":"Open notes 03 · §3","zh":"开放讲义 03 · 第3节"},"title":{"en":"The frontier invariant","zh":"边界的核心不变量"},"text":{"en":"Dijkstra grows a verified region outward from the start. On each turn it finalizes the unsettled vertex with the smallest known distance. Because every edge weight is non-negative, no later detour can make a settled distance smaller. The algorithm only relaxes edges that leave the newly settled vertex.","zh":"Dijkstra 从起点向外扩展一片“已确认区域”。每一轮，它在尚未确认的顶点中选择当前已知距离最小的一个。因为所有边的权重都非负，之后出现的任何绕路都不可能让已确认的距离更小。算法只需要松弛从新确认顶点出发的边。"}},{"code":"S4","label":{"en":"Open notes 03 · §4","zh":"开放讲义 03 · 第4节"},"title":{"en":"Relaxation leaves a trail","zh":"松弛会留下轨迹"},"text":{"en":"Relaxing an edge is a comparison, not a guess. If the settled distance plus the edge weight is smaller than the best distance currently recorded for the neighbor, replace that record and note the predecessor that produced it. The predecessor chain, followed backward from the destination, is the shortest path.","zh":"松弛一条边是在做比较，不是猜测。如果“已确认顶点的距离 + 边的权重”小于邻居当前的暂定距离，就更新这个距离，并记录产生它的前驱。从终点沿着前驱链倒推，就得到最短路径。"}},{"code":"S5","label":{"en":"Open notes 03 · §5","zh":"开放讲义 03 · 第5节"},"title":{"en":"The non-negative assumption","zh":"非负权重假设"},"text":{"en":"Non-negative weights are the license for Dijkstra's shortcut. If an edge can subtract value, a short expensive-looking prefix might later be outweighed by a negative edge. A negative cycle is worse: every lap lowers the total, so no cheapest route exists. Bellman-Ford-style methods revisit edges instead of permanently settling one vertex at a time.","zh":"非负权重是 Dijkstra 可以“抄近路”的许可证。如果一条边能减掉价值，一个看似昂贵的前缀，可能后来被负边抵消。负环更糟：每绕一圈，总成本都会继续下降，因此不存在最小的有限路线。Bellman-Ford 一类方法会反复检查边，而不是一次永久确认一个顶点。"}}],"lessons":[{"id":"read-the-network","kicker":{"en":"01 · Foundations","zh":"01 · 基础"},"title":{"en":"Read before you run","zh":"先读懂，再计算"},"summary":{"en":"Learn what vertices, edges, and weights mean, and why the cost of a route is a sum.","zh":"理解顶点、边和权重的含义，以及为什么路线成本必须相加。"},"duration":{"en":"6 min","zh":"6 分钟"},"body":[{"kind":"lead","text":{"en":"A route is not a list of stops. It is a claim about cost.","zh":"一条路线不是一串站名，而是一份成本声明。"},"source":"S1"},{"kind":"paragraph","text":{"en":"In a weighted graph, every edge uses one declared unit: minutes, metres, money, or delay. The unit is not decoration; it is what makes the numbers comparable and addable. The drawing is not the distance either. Two nodes can look close while the edge between them says twelve.","zh":"在加权图中，每条边都使用一套明确单位：分钟、米、金额或延误。单位不是装饰，它决定这些数字能否比较、能否相加。图中的位置也不等于距离：两个节点画得再近，只要边上写着 12，它们的连接成本就是 12。"},"source":"S1"},{"kind":"callout","title":{"en":"Do the arithmetic","zh":"真正要做的是加法"},"text":{"en":"A two-edge detour can beat a single direct edge. Compare routes by adding weights, not by counting arrows.","zh":"两段边可能比一段直达边更便宜。比较路线时要把权重相加，而不是数箭头。"},"source":"S2"}],"questions":[{"id":"cost-sum","prompt":{"en":"Route A uses edges weighted 4 and 3. Route B uses edges weighted 2, 2, and 2. Which route has the lower total cost?","zh":"路线 A 依次经过权重为 4 和 3 的两条边；路线 B 依次经过权重为 2、2、2 的三条边。哪条路线的总成本更低？"},"options":[{"id":"a","text":{"en":"Route A, because it has fewer stops","zh":"路线 A，因为停靠更少"}},{"id":"b","text":{"en":"Route B, because 2 + 2 + 2 is less than 4 + 3","zh":"路线 B，因为 2 + 2 + 2 小于 4 + 3"}},{"id":"c","text":{"en":"They tie, because both routes reach the same place","zh":"两者相同，因为终点一样"}}],"answer":"b","explanation":{"en":"Route B costs 6 while Route A costs 7. Dijkstra compares sums of weights, not the number of edges.","zh":"路线 B 的总成本是 6，路线 A 是 7。Dijkstra 比较的是权重之和，而不是边的数量。"},"source":"S2","concept":{"en":"Path cost is a sum","zh":"路径成本是权重之和"}},{"id":"weight-unit","prompt":{"en":"An edge is labeled 8. What does that number represent?","zh":"一条边标记为 8。这个数字代表什么？"},"options":[{"id":"a","text":{"en":"The algorithm has visited eight nodes","zh":"算法已经访问了八个节点"}},{"id":"b","text":{"en":"The segment costs 8 in the unit chosen by the mapmaker","zh":"该路段在制图者规定的单位下成本为 8"}},{"id":"c","text":{"en":"There are eight alternative routes","zh":"共有八条替代路线"}}],"answer":"b","explanation":{"en":"An edge weight is a defined cost for that link. Its meaning depends on the unit declared by the mapmaker.","zh":"边的权重是这条连接所定义的成本。它的含义取决于制图者声明的单位。"},"source":"S1","concept":{"en":"Weights are unit-bearing costs","zh":"权重是带单位的成本"}},{"id":"fewest-stops","prompt":{"en":"True or false: the route with the fewest stops always has the smallest total travel time.","zh":"判断：停靠站最少的路线，总是总旅行时间最短的路线。"},"options":[{"id":"a","text":{"en":"True","zh":"正确"}},{"id":"b","text":{"en":"False","zh":"错误"}}],"answer":"b","explanation":{"en":"The cheapest route has the smallest total weight. A route with more links can still have a lower sum.","zh":"最便宜的路线是总权重最小的路线。边更多的路线仍然可能有更小的总和。"},"source":"S2","concept":{"en":"Edge count is not path cost","zh":"边的数量不等于路径成本"}}]},{"id":"dijkstra-frontier","kicker":{"en":"02 · Interactive","zh":"02 · 交互"},"title":{"en":"The frontier tells the truth","zh":"边界为什么可信"},"summary":{"en":"Step a real Dijkstra computation and watch settled distances, relaxations, and the final route change.","zh":"亲手推进一次真实的 Dijkstra 计算，观察已确认距离、松弛和最终路线如何变化。"},"duration":{"en":"8 min","zh":"8 分钟"},"body":[{"kind":"lead","text":{"en":"Dijkstra looks cautious because it refuses to guess. That caution is what makes the answer auditable.","zh":"Dijkstra 看起来很谨慎，因为它拒绝猜测。正是这种谨慎让答案可以被检查。"},"source":"S3"},{"kind":"paragraph","text":{"en":"The algorithm keeps a tentative distance for every node and grows outward from the start. On each turn it confirms the unsettled node with the smallest tentative distance. With non-negative weights, any future detour can only add cost, so it cannot undercut a distance that has already been confirmed.","zh":"算法为每个节点保留暂定距离，并从起点向外扩展。每一轮，它确认尚未确认节点中暂定距离最小的一个。在所有边权重非负时，任何未来的绕路都只会增加成本，因此不可能推翻一个已被确认的距离。"},"source":"S3"},{"kind":"callout","title":{"en":"A settled node is not “near”","zh":"“已确认”不等于“看起来近”"},"text":{"en":"It is the node with the smallest known total cost among the unsettled set. The reason is the invariant, not the drawing.","zh":"它代表尚未确认的节点中，当前已知总成本最小的一个。理由是算法不变量，而不是图上的视觉距离。"},"source":"S3"},{"kind":"paragraph","text":{"en":"Relaxation is where an improved route enters the record. The algorithm compares the current best distance with a new candidate and updates a predecessor only when the candidate is smaller. Following predecessors backward from the destination reconstructs the path.","zh":"优化后的路线通过“松弛”进入记录。算法把当前最好距离与新的候选值进行比较，只有在候选值更小时才更新前驱。从终点沿前驱倒推，就能重建路径。"},"source":"S4"}],"visual":{"type":"dijkstra","start":"LIB","goal":"LAB","nodes":[{"id":"LIB","label":{"en":"Library","zh":"图书馆"},"x":82,"y":202},{"id":"STA","label":{"en":"Station","zh":"车站"},"x":266,"y":78},{"id":"CAN","label":{"en":"Canteen","zh":"食堂"},"x":286,"y":314},{"id":"LAB","label":{"en":"Lab","zh":"实验室"},"x":566,"y":190},{"id":"HALL","label":{"en":"Hall","zh":"宿舍"},"x":548,"y":350}],"edges":[{"from":"LIB","to":"STA","weight":4},{"from":"LIB","to":"CAN","weight":2},{"from":"STA","to":"CAN","weight":1},{"from":"STA","to":"LAB","weight":8},{"from":"STA","to":"HALL","weight":9},{"from":"CAN","to":"LAB","weight":7},{"from":"CAN","to":"HALL","weight":6},{"from":"LAB","to":"HALL","weight":2}],"trace":{"start":"LIB","goal":"LAB","distance":9,"path":["LIB","CAN","LAB"],"steps":[{"current":null,"settled":[],"distances":{"LIB":0,"STA":null,"CAN":null,"LAB":null,"HALL":null},"relaxations":[]},{"current":"LIB","settled":["LIB"],"distances":{"LIB":0,"STA":4,"CAN":2,"LAB":null,"HALL":null},"relaxations":[{"from":"LIB","to":"CAN","weight":2,"previous":null,"distance":2},{"from":"LIB","to":"STA","weight":4,"previous":null,"distance":4}]},{"current":"CAN","settled":["LIB","CAN"],"distances":{"LIB":0,"STA":3,"CAN":2,"LAB":9,"HALL":8},"relaxations":[{"from":"CAN","to":"HALL","weight":6,"previous":null,"distance":8},{"from":"CAN","to":"LAB","weight":7,"previous":null,"distance":9},{"from":"CAN","to":"STA","weight":1,"previous":4,"distance":3}]},{"current":"STA","settled":["LIB","CAN","STA"],"distances":{"LIB":0,"STA":3,"CAN":2,"LAB":9,"HALL":8},"relaxations":[]},{"current":"HALL","settled":["LIB","CAN","STA","HALL"],"distances":{"LIB":0,"STA":3,"CAN":2,"LAB":9,"HALL":8},"relaxations":[]},{"current":"LAB","settled":["LIB","CAN","STA","HALL","LAB"],"distances":{"LIB":0,"STA":3,"CAN":2,"LAB":9,"HALL":8},"relaxations":[]}]}},"questions":[{"id":"next-node","prompt":{"en":"During Dijkstra, which unsettled node is confirmed next?","zh":"在 Dijkstra 中，下一个被确认的是哪个尚未确认的节点？"},"options":[{"id":"a","text":{"en":"The one with the smallest tentative distance","zh":"暂定距离最小的节点"}},{"id":"b","text":{"en":"The one with the most outgoing edges","zh":"出边最多的节点"}},{"id":"c","text":{"en":"The one drawn closest to the destination","zh":"在图上离终点最近的节点"}}],"answer":"a","explanation":{"en":"Each turn finalizes the unsettled vertex with the smallest known distance. The drawing does not decide the order.","zh":"每一轮都会确认尚未确认的节点中当前已知距离最小的一个。图上的位置不决定顺序。"},"source":"S3","concept":{"en":"Dijkstra selects the smallest frontier","zh":"Dijkstra 选择最小的边界距离"}},{"id":"settled-safety","prompt":{"en":"Why can a confirmed distance be trusted when all weights are non-negative?","zh":"当所有边权重都非负时，为什么一个已确认距离可以信任？"},"options":[{"id":"a","text":{"en":"Because a confirmed node can never be reached again","zh":"因为已确认节点之后永远不会再被到达"}},{"id":"b","text":{"en":"Because later paths can only add or preserve cost","zh":"因为之后的路径只会增加或保持成本"}},{"id":"c","text":{"en":"Because every edge has the same weight","zh":"因为每条边的权重都相同"}}],"answer":"b","explanation":{"en":"Non-negative edge weights mean a future detour cannot subtract cost, so it cannot produce a smaller distance than the confirmed minimum.","zh":"非负边权重意味着未来的绕路不能减去成本，因此不可能产生比已确认最小值更小的距离。"},"source":"S3","concept":{"en":"Non-negative weights protect settled nodes","zh":"非负权重保护已确认节点"}},{"id":"relaxation","prompt":{"en":"What does relaxing edge u → v do?","zh":"松弛边 u → v 实际上做了什么？"},"options":[{"id":"a","text":{"en":"It deletes v from the graph","zh":"从图中删除节点 v"}},{"id":"b","text":{"en":"It chooses a random nearest node","zh":"随机选择最近的节点"}},{"id":"c","text":{"en":"It compares dist[u] + weight(u, v) with dist[v] and may lower dist[v]","zh":"比较 dist[u] + weight(u, v) 与 dist[v]，并可能降低 dist[v]"}}],"answer":"c","explanation":{"en":"Relaxation is a comparison. If the new candidate is smaller, the distance and predecessor are updated.","zh":"松弛是一种比较。如果新的候选值更小，就更新距离和前驱。"},"source":"S4","concept":{"en":"Relaxation updates by comparison","zh":"松弛通过比较完成更新"}}]},{"id":"assumption-check","kicker":{"en":"03 · Limits","zh":"03 · 限制"},"title":{"en":"Know when the shortcut fails","zh":"知道捷径何时失效"},"summary":{"en":"See why Dijkstra needs non-negative weights and what a negative cycle does to the question.","zh":"理解为什么 Dijkstra 需要非负权重，以及负环会怎样改变问题本身。"},"duration":{"en":"5 min","zh":"5 分钟"},"body":[{"kind":"lead","text":{"en":"Every shortcut has a fine-print clause.","zh":"每条捷径都有一行需要认真阅读的小字。"},"source":"S5"},{"kind":"paragraph","text":{"en":"Dijkstra's proof depends on non-negative edge weights. If an edge can subtract value, a node that looked safely settled may later receive a cheaper route through that negative edge. The algorithm's promise no longer holds.","zh":"Dijkstra 的正确性证明依赖非负边权重。如果一条边可以减去价值，一个看似已经安全确认的节点，之后可能通过这条负边获得更便宜的路线。算法的承诺就不再生效。"},"source":"S5"},{"kind":"callout","title":{"en":"A negative cycle changes the question","zh":"负环改变了问题本身"},"text":{"en":"Every lap lowers the total, so there is no finite cheapest route. Bellman-Ford-style methods revisit edges instead of permanently settling each node once.","zh":"每绕一圈总成本都会下降，因此不存在有限的最便宜路线。Bellman-Ford 一类方法会反复检查边，而不是把每个节点永久确认一次。"},"source":"S5"}],"questions":[{"id":"valid-weights","prompt":{"en":"Which condition is Dijkstra's key non-negative shortcut built on?","zh":"Dijkstra 的这条非负捷径依赖哪个条件？"},"options":[{"id":"a","text":{"en":"The graph must be a tree","zh":"图必须是一棵树"}},{"id":"b","text":{"en":"No edge may have a negative weight","zh":"任何边的权重都不能为负"}},{"id":"c","text":{"en":"Every node must have the same degree","zh":"每个节点的度数必须相同"}}],"answer":"b","explanation":{"en":"The invariant needs non-negative weights. Tree shape and equal degree are not the requirement.","zh":"这个不变量需要非负权重。树的形状或相同度数都不是前提。"},"source":"S5","concept":{"en":"Dijkstra requires non-negative weights","zh":"Dijkstra 要求非负权重"}},{"id":"negative-cycle","prompt":{"en":"Why can a negative cycle break shortest-path search?","zh":"为什么负环会破坏最短路径搜索？"},"options":[{"id":"a","text":{"en":"Each lap lowers the total, so no finite minimum exists","zh":"每绕一圈总成本都会下降，因此不存在有限最小值"}},{"id":"b","text":{"en":"Every cycle increases the total weight","zh":"每个环都会增加总权重"}},{"id":"c","text":{"en":"It turns the graph into an unweighted graph","zh":"它把图变成无权图"}}],"answer":"a","explanation":{"en":"Repeating a negative cycle keeps reducing the total. There is no finite route that could be called the minimum.","zh":"重复经过负环会不断降低总成本。因此不存在可称为最小值的有限路线。"},"source":"S5","concept":{"en":"Negative cycles remove a finite minimum","zh":"负环使有限最小值不存在"}},{"id":"bellman-ford","prompt":{"en":"What do Bellman-Ford-style methods do differently?","zh":"Bellman-Ford 一类方法的做法有何不同？"},"options":[{"id":"a","text":{"en":"They ignore edge weights completely","zh":"完全忽略边权重"}},{"id":"b","text":{"en":"They only work on trees","zh":"只适用于树"}},{"id":"c","text":{"en":"They revisit edges instead of permanently settling each node once","zh":"反复检查边，而不是把每个节点永久确认一次"}}],"answer":"c","explanation":{"en":"Revisiting edges allows later negative improvements to be discovered. Dijkstra's permanent settlement is what becomes unsafe.","zh":"反复检查边可以发现后来的负向改进。变得不安全的是 Dijkstra 的永久确认操作。"},"source":"S5","concept":{"en":"Bellman-Ford revisits edges","zh":"Bellman-Ford 反复检查边"}}]}]}</script>

      if (value !== undefined) node.textContent = String(value);
      return node;
    };
    const lessonSourceCodes = (lesson) => {
      const codes = new Set();
      for (const block of lesson.body || []) if (block.source) codes.add(block.source);
      for (const question of lesson.questions || []) if (question.source) codes.add(question.source);
      return codes;
    };
    function setStaticCopy() {
      const c = copy[state.lang];
      refs.lang.textContent = c.langButton;
      refs.eyebrow.textContent = state.lang === "zh" ? "离线学习包" : "Offline study pack";
      refs.sourcesTitle.textContent = c.sourceTitle;
      refs.sourcesSubtitle.textContent = c.sourcesSubtitle;
      refs.practiceTitle.textContent = c.practiceTitle;
      refs.practiceSubtitle.textContent = c.practiceSubtitle;
      refs.footer.textContent = c.footer;
      refs.seal.textContent = c.offline;
      refs.note.textContent = c.note;
      refs.subtitle.textContent = text(pack.subtitle);
      document.documentElement.lang = state.lang;
    }
    function renderNav() {
      const c = copy[state.lang];
      refs.nav.replaceChildren();
      const label = element("div", "nav-label", state.lang === "zh" ? "课程目录" : "Course map");
      refs.nav.append(label);
      pack.lessons.forEach((lesson, index) => {
        const button = element("button", "lesson-button");
        button.type = "button";
        button.setAttribute("aria-current", index === state.lesson ? "page" : "false");
        const number = element("span", "lesson-number", String(index + 1).padStart(2, "0"));
        const copyBox = element("span");
        copyBox.append(element("strong", "", text(lesson.title)), element("small", "", text(lesson.duration)));
        button.append(number, copyBox);
        button.addEventListener("click", () => {
          state.lesson = index;
          state.step = 0;
          render();
        });
        refs.nav.append(button);
      });
    }
    function sourceChip(code) {
      const c = copy[state.lang];
      const button = element("button", "source-chip", `${c.source} ${code}`);
      button.type = "button";
      button.setAttribute("aria-label", `${c.source} ${code}`);
      button.addEventListener("click", () => {
        const source = document.querySelector(`[data-source-card="${code}"]`);
        if (!source) return;
        source.open = true;
        source.scrollIntoView({ block: "center" });
        source.querySelector("summary").focus();
      });
      return button;
    }
    function renderReading(lesson) {
      refs.reading.replaceChildren();
      for (const block of lesson.body || []) {
        const wrapper = element("div", `reading-block ${block.kind}`);
        if (block.kind === "callout") {
          const callout = element("div", "callout");
          callout.append(element("h3", "", text(block.title)), element("p", "", text(block.text)));
          if (block.source) callout.append(sourceChip(block.source));
          wrapper.append(callout);
        } else {
          wrapper.append(element("p", "", text(block.text)));
          if (block.source) wrapper.append(sourceChip(block.source));
        }
        refs.reading.append(wrapper);
      }
      refs.reading.append(element("p", "muted", copy[state.lang].sourceNote));
    }
    function renderSources(lesson) {
      const c = copy[state.lang];
      refs.sources.replaceChildren();
      const codes = lessonSourceCodes(lesson);
      for (const source of pack.sources.filter((item) => codes.has(item.code))) {
        const details = element("details", "source-card");
        details.dataset.sourceCard = source.code;
        const summary = element("summary");
        const meta = element("span", "source-summary");
        meta.append(
          element("strong", "", text(source.title)),
          element("small", "", text(source.label))
        );
        summary.append(element("span", "source-code", source.code), meta);
        details.append(summary, element("blockquote", "source-quote", text(source.text)));
        refs.sources.append(details);
      }
      if (!refs.sources.children.length) {
        refs.sources.append(element("p", "muted", c.noSources || ""));
      }
    }
    function svgElement(tag, attributes) {
      const node = document.createElementNS("http://www.w3.org/2000/svg", tag);
      for (const [name, value] of Object.entries(attributes || {})) node.setAttribute(name, String(value));
      return node;
    }
    function renderGraph(lesson) {
      const c = copy[state.lang];
      const visual = lesson.visual;
      refs.visualSection.hidden = !visual;
      if (!visual) return;
      refs.visualTitle.textContent = c.visualTitles.title;
      refs.visualSubtitle.textContent = c.visualTitles.subtitle;
      const trace = visual.trace;
      const currentStep = Math.min(state.step, trace.steps.length - 1);
      const step = trace.steps[currentStep];
      const final = currentStep === trace.steps.length - 1;
      const finalEdges = new Set();
      if (final && trace.path.length > 1) {
        for (let index = 0; index < trace.path.length - 1; index += 1) {
          finalEdges.add([trace.path[index], trace.path[index + 1]].sort().join("|"));
        }
      }
      refs.graph.replaceChildren();
      const graphTitle = svgElement("title", { id: "graph-title" });
      graphTitle.textContent = `${text(lesson.title)}: ${c.finalPath} ${trace.path.map((id) => {
        const node = visual.nodes.find((item) => item.id === id);
        return node ? text(node.label) : id;
      }).join(" → ")}`;
      refs.graph.append(graphTitle);
      const nodeMap = new Map(visual.nodes.map((node) => [node.id, node]));
      for (const edge of visual.edges) {
        const source = nodeMap.get(edge.from);
        const target = nodeMap.get(edge.to);
        if (!source || !target) continue;
        const key = [edge.from, edge.to].sort().join("|");
        const line = svgElement("line", {
          x1: source.x, y1: source.y, x2: target.x, y2: target.y,
          class: `graph-edge${finalEdges.has(key) ? " final" : ""}`
        });
        refs.graph.append(line);
        const midX = (source.x + target.x) / 2;
        const midY = (source.y + target.y) / 2;
        refs.graph.append(svgElement("rect", {
          x: midX - 14, y: midY - 12, width: 28, height: 24, rx: 6, class: "edge-label-bg"
        }));
        const weight = svgElement("text", {
          x: midX, y: midY + 5, "text-anchor": "middle", class: "edge-label"
        });
        weight.textContent = edge.weight;
        refs.graph.append(weight);
      }
      for (const node of visual.nodes) {
        const isCurrent = step.current === node.id;
        const isSettled = step.settled.includes(node.id);
        const group = svgElement("g", {
          class: `node${isCurrent ? " current" : isSettled ? " settled" : ""}`,
          transform: `translate(${node.x} ${node.y})`,
          "aria-label": `${text(node.label)}: ${step.distances[node.id] ?? copy[state.lang].unreachable}`
        });
        group.append(svgElement("circle", { r: 25 }));
        const label = svgElement("text", { y: 4 });
        label.textContent = node.id;
        group.append(label);
        refs.graph.append(group);
      }
      refs.stepCount.textContent = `${c.step} ${currentStep + 1} ${c.ofWord} ${trace.steps.length}`;
      refs.reset.textContent = c.reset;
      refs.back.textContent = c.back;
      refs.next.textContent = c.next;
      refs.back.disabled = currentStep === 0;
      refs.next.disabled = currentStep === trace.steps.length - 1;
      refs.reset.disabled = currentStep === 0;
      refs.distanceLabel.textContent = c.settled;
      refs.relaxationLabel.textContent = c.relax;
      refs.distances.replaceChildren();
      for (const node of visual.nodes) {
        const distance = step.distances[node.id];
        const pill = element("span", "distance-pill", `${node.id} ${distance === null ? "∞" : distance}`);
        if (step.current === node.id) pill.classList.add("current");
        else if (step.settled.includes(node.id)) pill.classList.add("settled");
        refs.distances.append(pill);
      }
      refs.relaxations.replaceChildren();
      if (!step.relaxations.length) {
        refs.relaxations.append(element("p", "relaxation-line muted", c.noRelax));
      } else {
        for (const relaxation of step.relaxations) {
          refs.relaxations.append(element(
            "p", "relaxation-line",
            `${relaxation.from}→${relaxation.to}: ${relaxation.previous === null ? "∞" : relaxation.previous} → ${relaxation.distance}`
          ));
        }
      }
      if (final) {
        const pathNames = trace.path.map((id) => text(nodeMap.get(id)?.label || id)).join(" → ");
        const summary = element("p", "relaxation-line final-summary", `${c.finalPath}: ${pathNames} · ${trace.distance ?? "∞"}`);
        refs.relaxations.append(summary);
      }
    }
    function renderPractice(lesson) {
      const c = copy[state.lang];
      refs.practice.replaceChildren();
      const questions = lesson.questions || [];
      if (!questions.length) {
        refs.practice.append(element("p", "empty-practice", c.readingOnly));
        return;
      }
      const intro = element("div", "practice-intro");
      intro.append(element("p", "", state.lang === "zh"
        ? `${questions.length} 道客观题。提交后会显示答案、解释与来源。`
        : `${questions.length} objective checks. Submit to reveal answers, reasoning, and the matching source.`));
      refs.practice.append(intro);
      const form = element("form", "question-list");
      form.noValidate = true;
      questions.forEach((question, index) => {
        const block = element("div", "question");
        const fieldset = element("fieldset");
        const legend = element("legend");
        legend.append(element("span", "question-number", String(index + 1).padStart(2, "0")), document.createTextNode(text(question.prompt)));
        fieldset.append(legend);
        question.options.forEach((option) => {
          const label = element("label", "option");
          const input = element("input");
          input.type = "radio";
          input.name = question.id;
          input.value = option.id;
          label.append(input, element("span", "", text(option.text)));
          fieldset.append(label);
        });
        block.append(fieldset);
        form.append(block);
      });
      const submitRow = element("div", "submit-row");
      const submit = element("button", "submit-button", c.submit);
      submit.type = "submit";
      const status = element("span", "form-status");
      status.setAttribute("role", "alert");
      submitRow.append(submit, status);
      form.append(submitRow);
      const results = element("div", "result-list");
      results.setAttribute("aria-live", "polite");
      refs.practice.append(form, results);
      form.addEventListener("submit", (event) => {
        event.preventDefault();
        status.textContent = "";
        const data = new FormData(form);
        const answers = {};
        for (const question of questions) {
          const value = data.get(question.id);
          if (!value) {
            status.textContent = c.incomplete;
            const firstMissing = form.querySelector(`input[name="${question.id}"]`);
            if (firstMissing) firstMissing.focus();
            return;
          }
          answers[question.id] = String(value);
        }
        renderResults(lesson, answers, results);
        results.scrollIntoView({ block: "nearest" });
      });
    }
    function renderResults(lesson, answers, results) {
      const c = copy[state.lang];
      const sourceMap = new Map(pack.sources.map((source) => [source.code, source]));
      let score = 0;
      results.replaceChildren();
      const summary = element("div", "result-summary");
      for (const question of lesson.questions) if (answers[question.id] === question.answer) score += 1;
      summary.append(element("strong", "", `${c.score} ${score} / ${lesson.questions.length} ${c.correct}`));
      const retry = element("button", "retry-button", c.retry);
      retry.type = "button";
      retry.addEventListener("click", () => {
        results.replaceChildren();
        refs.practice.querySelectorAll("input[type=radio]").forEach((input) => { input.checked = false; });
        refs.practice.querySelector("input[type=radio]")?.focus();
      });
      summary.append(document.createElement("br"), retry);
      results.append(summary);
      for (const question of lesson.questions) {
        const isCorrect = answers[question.id] === question.answer;
        const result = element("div", `result${isCorrect ? "" : " incorrect"}`);
        result.append(element("p", "result-label", isCorrect ? `${c.correctWord} ✓` : `${c.incorrect} — ${c.explanation}`));
        result.append(element("p", "", text(question.explanation)));
        const source = sourceMap.get(question.source);
        if (source) {
          result.append(element("p", "muted", `${c.source} ${source.code} · ${text(source.title)}`));
        }
        results.append(result);
      }
    }
    function localLessonLabel(lesson, index) {
      const c = copy[state.lang];
      return state.lang === "zh"
        ? `${c.lessonLabel}${index + 1}${c.of}${pack.lessons.length}${c.minutes}`
        : `${c.lessonLabel} ${index + 1} ${c.of} ${pack.lessons.length}`;
    }
    function render() {
      setStaticCopy();
      renderNav();
      const lesson = pack.lessons[state.lesson];
      refs.meta.replaceChildren(
        element("span", "", text(lesson.kicker)),
        element("span", "", localLessonLabel(lesson, state.lesson)),
        element("span", "", text(lesson.duration))
      );
      refs.title.textContent = text(lesson.title);
      refs.summary.textContent = text(lesson.summary);
      renderReading(lesson);
      renderGraph(lesson);
      renderSources(lesson);
      renderPractice(lesson);
      document.title = `${text(lesson.title)} · ${text(pack.title)}`;
      refs.content.focus({ preventScroll: true });
    }
    refs.lang.addEventListener("click", () => {
      state.lang = state.lang === "en" ? "zh" : "en";
      render();
    });
    refs.reset.addEventListener("click", () => { state.step = 0; renderGraph(pack.lessons[state.lesson]); });
    refs.back.addEventListener("click", () => {
      state.step = Math.max(0, state.step - 1);
      renderGraph(pack.lessons[state.lesson]);
    });
    refs.next.addEventListener("click", () => {
      const trace = pack.lessons[state.lesson].visual.trace;
      state.step = Math.min(trace.steps.length - 1, state.step + 1);
      renderGraph(pack.lessons[state.lesson]);
    });
    render();
  </script>
</body>
</html>
